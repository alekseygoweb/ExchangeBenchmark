# AmneziaWG -> Xray (tun xray0) bridge — параметры ядра
# Устанавливается в /etc/sysctl.d/99-awg-xray.conf

# Включаем IP-форвардинг: пакеты клиентов должны пересылаться между awg0 и xray0.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# rp_filter = 2 (loose). При policy-routing путь пакета «туда» (через xray0) и
# «обратно» (через awg0) асимметричен относительно main-таблицы. Строгий
# reverse-path filter (1) отбросил бы ответные пакеты, приходящие из xray0
# (их источник — реальный сайт, а маршрут к нему идёт через eth0, а не xray0).
# max(all, iface) => ставим all и default в loose, чтобы правило действовало и на
# динамически создаваемые интерфейсы awg0/xray0.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
